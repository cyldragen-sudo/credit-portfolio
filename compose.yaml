# Optional isolated database. FineReport is installed separately.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: credit_portfolio_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private environment}
    ports:
      - "127.0.0.1:${CREDIT_POSTGRES_PORT:-55433}:5432"
    volumes:
      - credit_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_portfolio_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  credit_demo_data:
